config-version = 2

# Keybindings below are the stock AeroSpace defaults, verbatim from
# /Applications/AeroSpace.app/Contents/Resources/default-config.toml.
# Modifier is the physical Option (alt) key — no Karabiner remap involved.
# Everything above the [mode.*] tables is local customisation.

# ── Startup ──────────────────────────────────────────────────────────────────
# Border colours/width live in ~/.config/borders/bordersrc, not here — the
# borders daemon (brew services) applies them on start. Don't re-add a
# `borders active_color=...` line: it runs after login and overrides bordersrc.
after-startup-command = [
    'exec-and-forget sketchybar',
]

start-at-login = true
automatically-unhide-macos-hidden-apps = true

# ── Layout defaults ───────────────────────────────────────────────────────────
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Five named workspaces, kept alive even when empty so the keys and the
# SketchyBar pills always land somewhere. Bound to alt-1..alt-5 below.
persistent-workspaces = ['desktop', 'terminal', 'browser', 'comms', 'man']

# ── Tree normalizations ───────────────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ── Mouse follows focus ───────────────────────────────────────────────────────
on-focused-monitor-changed = []
on-focus-changed = []

# ── Sketchybar integration ────────────────────────────────────────────────────
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# ── Key mapping ───────────────────────────────────────────────────────────────
[key-mapping]
    preset = 'qwerty'

# ── Gaps (Hyprland-style breathing room) ─────────────────────────────────────
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    # Per-monitor, because the sketchybar (bottom edge = y_offset 2 + height
    # 24 = 26pt) is only "free" on the built-in: its 28pt notch safe area
    # swallows the bar, so 8 there lands windows at safeArea(28) + 8 = 36pt,
    # clear. Every other display (the DELL dock) reserves nothing at the top
    # and the bar just floats over it, so the *gap* has to clear the 26pt bar
    # plus the ~3pt JankyBorders overhang — 34 puts window tops (and their
    # borders) ~5pt below the bar. Verified docked 2026-08-30.
    outer.top        = [{ monitor.'built-in' = 8 }, 34]
    outer.right      = 8

# ── Window rules ──────────────────────────────────────────────────────────────
# Apps that open floating rather than joining the tiles. Only fires on newly
# detected windows — reopen an already-open window for a new rule to take hold.
# Get an app-id with `aerospace list-apps`.
[[on-window-detected]]  # Activity Monitor
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'

[[on-window-detected]]  # App Store
    if.app-id = 'com.apple.AppStore'
    run = 'layout floating'

[[on-window-detected]]  # Archive Utility
    if.app-id = 'com.apple.archiveutility'
    run = 'layout floating'

[[on-window-detected]]  # Calculator
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]  # Finder
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]  # Messages
    if.app-id = 'com.apple.MobileSMS'
    run = 'layout floating'

[[on-window-detected]]  # Music
    if.app-id = 'com.apple.Music'
    run = 'layout floating'

[[on-window-detected]]  # Notes
    if.app-id = 'com.apple.Notes'
    run = 'layout floating'

[[on-window-detected]]  # Screens Connect
    if.app-id = 'com.edovia.Screens-Connect'
    run = 'layout floating'

[[on-window-detected]]  # System Settings
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]  # Weather
    if.app-id = 'com.apple.weather'
    run = 'layout floating'

# ── Main keybindings (AeroSpace defaults) ────────────────────────────────────
[mode.main.binding]
    # Layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Workspaces — five named, positional. See persistent-workspaces above and
    # the SketchyBar pills (dotfiles/sketchybar/sketchybarrc). 6-9 / A-Z dropped.
    alt-1 = 'workspace desktop'
    alt-2 = 'workspace terminal'
    alt-3 = 'workspace browser'
    alt-4 = 'workspace comms'
    alt-5 = 'workspace man'

    # Move focused window to workspace (same positional keys + shift)
    alt-shift-1 = 'move-node-to-workspace desktop'
    alt-shift-2 = 'move-node-to-workspace terminal'
    alt-shift-3 = 'move-node-to-workspace browser'
    alt-shift-4 = 'move-node-to-workspace comms'
    alt-shift-5 = 'move-node-to-workspace man'

    # Workspace navigation
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Service mode
    alt-shift-semicolon = 'mode service'

# ── Service mode (AeroSpace defaults) ────────────────────────────────────────
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
