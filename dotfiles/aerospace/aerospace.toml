# AeroSpace config — tmux-style keybindings
# Leader (tmux "prefix") = alt-a. Press alt-a, then a command key (like tmux).
# Docs: https://nikitabobko.github.io/AeroSpace/guide
config-version = 2

# Start AeroSpace at login
start-at-login = true

# Auto-reload this file on save (reload once manually the first time)
auto-reload-config = true

# --- Normalizations & layout defaults ---
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when the focused monitor changes
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# Only keep workspaces 1-9 alive (mirrors tmux window numbers, base-index 1)
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

# --- Integrations with SketchyBar ---
# Refresh the workspace highlight in SketchyBar on every workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]
# Update the "PREFIX" indicator whenever the binding mode changes
on-mode-changed = ['exec-and-forget sketchybar --trigger aerospace_mode_change']
# Draw the initial workspace highlight once everything is up
after-startup-command = ['exec-and-forget sketchybar --trigger aerospace_workspace_change']

# --- Gaps (leaves room for borders to breathe) ---
gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        8
gaps.outer.right =      8

##############################################################################
# MAIN mode — the only global shortcut is the tmux leader.
# Everything else lives inside "tmux" mode below (press alt-a first).
##############################################################################
[mode.main.binding]
    # tmux prefix: press this, then a command key
    alt-a = 'mode tmux'

    # Convenience (no clean tmux equivalent): send window to workspace N instantly
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

##############################################################################
# TMUX mode — entered with the leader (alt-a). Mirrors tmux muscle memory.
# Most keys perform an action and drop you back to MAIN (like tmux).
# Resize keys STAY in this mode so you can repeat them; press esc/enter/q to exit.
##############################################################################
[mode.tmux.binding]
    # --- leave the mode (do nothing) ---
    esc   = 'mode main'
    enter = 'mode main'
    q     = 'mode main'
    alt-a = 'mode main'          # tap leader twice to cancel

    # --- focus panes: hjkl or arrows (tmux prefix + arrows) ---
    h = ['focus left',  'mode main']
    j = ['focus down',  'mode main']
    k = ['focus up',    'mode main']
    l = ['focus right', 'mode main']
    left  = ['focus left',  'mode main']
    down  = ['focus down',  'mode main']
    up    = ['focus up',    'mode main']
    right = ['focus right', 'mode main']

    # --- move panes: shift + hjkl (tmux prefix + { } / swap) ---
    shift-h = ['move left',  'mode main']
    shift-j = ['move down',  'mode main']
    shift-k = ['move up',    'mode main']
    shift-l = ['move right', 'mode main']

    # --- resize: ctrl + hjkl, stays in mode to repeat (tmux prefix + ctrl-arrows) ---
    ctrl-h = 'resize width -50'
    ctrl-l = 'resize width +50'
    ctrl-k = 'resize height -50'
    ctrl-j = 'resize height +50'

    # --- splits: % = left/right, " = top/bottom (tmux defaults) ---
    # 'split' is a no-op with normalization enabled; set the container
    # orientation instead so the next window lands where you expect.
    shift-5     = ['layout tiles horizontal', 'mode main']   # %  (split-window -h)
    shift-quote = ['layout tiles vertical',   'mode main']   # "  (split-window -v)
    # friendly aliases
    backslash = ['layout tiles horizontal', 'mode main']     # \ (like |)
    minus     = ['layout tiles vertical',   'mode main']     # -

    # --- join-with: nest the focused window with its neighbour into a new
    # container (the true "split just this pane off" move). Open the second
    # window first, then join toward it. Stays in mode to chain joins.
    alt-shift-h = 'join-with left'
    alt-shift-j = 'join-with down'
    alt-shift-k = 'join-with up'
    alt-shift-l = 'join-with right'

    # --- zoom / close (tmux z / x) ---
    z = ['fullscreen',    'mode main']                # zoom pane
    x = ['close',         'mode main']                # kill pane (no confirm)

    # --- workspaces = tmux windows ---
    1 = ['workspace 1', 'mode main']
    2 = ['workspace 2', 'mode main']
    3 = ['workspace 3', 'mode main']
    4 = ['workspace 4', 'mode main']
    5 = ['workspace 5', 'mode main']
    6 = ['workspace 6', 'mode main']
    7 = ['workspace 7', 'mode main']
    8 = ['workspace 8', 'mode main']
    9 = ['workspace 9', 'mode main']
    n = ['workspace --wrap-around next', 'mode main']  # next window
    p = ['workspace --wrap-around prev', 'mode main']  # previous window
    tab = ['workspace-back-and-forth',   'mode main']  # last window

    # --- layout / misc ---
    space  = ['layout tiles accordion', 'mode main']  # cycle layout (tmux space)
    f      = ['layout floating tiling', 'mode main']  # toggle float
    equal  = ['balance-sizes',          'mode main']  # even out sizes
    e      = ['flatten-workspace-tree', 'mode main']  # reset/flatten layout
    r      = ['reload-config',          'mode main']  # reload config (tmux r)
