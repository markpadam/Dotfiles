config-version = 2

# Modifier: Karabiner-Elements remaps Caps Lock (held) -> Ctrl+Option, used
# below as `ctrl-alt`. Caps Lock tapped alone sends Escape. If you change the
# prefix here, change ~/.config/karabiner/karabiner.json to match or the
# shortcuts stop working.

# ── Startup ──────────────────────────────────────────────────────────────────
after-startup-command = [
    'exec-and-forget sketchybar',
    'exec-and-forget borders active_color="glow(0xff00ffaa)" inactive_color=0xff313244 width=6.0',
]

start-at-login = true
automatically-unhide-macos-hidden-apps = true

# ── Layout defaults ───────────────────────────────────────────────────────────
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# ── Tree normalizations ───────────────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ── Mouse follows focus ───────────────────────────────────────────────────────
on-focused-monitor-changed = []
on-focus-changed = []

# ── Sketchybar integration ────────────────────────────────────────────────────
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# ── Key mapping ───────────────────────────────────────────────────────────────
[key-mapping]
    preset = 'qwerty'

# ── Gaps (Hyprland-style breathing room) ─────────────────────────────────────
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    # Must clear the sketchybar: y_offset (4) + height (36) + shadow/breathing room.
    # 16 left the bar's translucent, blurred lower edge sitting on top of window headers.
    outer.top        = 48
    outer.right      = 8

# ── Window rules ──────────────────────────────────────────────────────────────
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

# ── Main keybindings ──────────────────────────────────────────────────────────
# `ctrl-alt` = the Caps Lock hyper key (see note at top of file).
[mode.main.binding]
    # Focus (vim-style)
    ctrl-alt-h = 'focus left'
    ctrl-alt-j = 'focus down'
    ctrl-alt-k = 'focus up'
    ctrl-alt-l = 'focus right'

    # Move windows (vim-style)
    ctrl-alt-shift-h = 'move left'
    ctrl-alt-shift-j = 'move down'
    ctrl-alt-shift-k = 'move up'
    ctrl-alt-shift-l = 'move right'

    # Resize
    ctrl-alt-minus = 'resize smart -50'
    ctrl-alt-equal = 'resize smart +50'

    # Layout toggles
    ctrl-alt-slash       = 'layout tiles horizontal vertical'
    ctrl-alt-comma       = 'layout accordion horizontal vertical'
    ctrl-alt-shift-space = 'layout floating tiling'
    ctrl-alt-f           = 'macos-native-fullscreen'

    # Workspace switching (number-based)
    ctrl-alt-1 = 'workspace 1'
    ctrl-alt-2 = 'workspace 2'
    ctrl-alt-3 = 'workspace 3'
    ctrl-alt-4 = 'workspace 4'
    ctrl-alt-5 = 'workspace 5'
    ctrl-alt-6 = 'workspace 6'
    ctrl-alt-7 = 'workspace 7'
    ctrl-alt-8 = 'workspace 8'
    ctrl-alt-9 = 'workspace 9'

    # Move window to workspace
    ctrl-alt-shift-1 = 'move-node-to-workspace 1'
    ctrl-alt-shift-2 = 'move-node-to-workspace 2'
    ctrl-alt-shift-3 = 'move-node-to-workspace 3'
    ctrl-alt-shift-4 = 'move-node-to-workspace 4'
    ctrl-alt-shift-5 = 'move-node-to-workspace 5'
    ctrl-alt-shift-6 = 'move-node-to-workspace 6'
    ctrl-alt-shift-7 = 'move-node-to-workspace 7'
    ctrl-alt-shift-8 = 'move-node-to-workspace 8'
    ctrl-alt-shift-9 = 'move-node-to-workspace 9'

    # Workspace navigation
    ctrl-alt-tab       = 'workspace-back-and-forth'
    ctrl-alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Window management
    ctrl-alt-q     = 'close'
    ctrl-alt-enter = 'exec-and-forget osascript -e "tell application \"Ghostty\" to new window"'

    # Mode switching
    ctrl-alt-shift-semicolon = 'mode service'
    ctrl-alt-r               = 'mode resize'

    # Disable accidental macOS app hide shortcuts
    cmd-h     = []
    cmd-alt-h = []

# ── Service mode ──────────────────────────────────────────────────────────────
[mode.service.binding]
    esc       = ['reload-config', 'mode main']
    r         = ['flatten-workspace-tree', 'mode main']
    f         = ['layout floating tiling', 'mode main']
    backspace = ['close-all-windows-but-current', 'mode main']

    # Join windows into a container
    ctrl-alt-shift-h = ['join-with left',  'mode main']
    ctrl-alt-shift-j = ['join-with down',  'mode main']
    ctrl-alt-shift-k = ['join-with up',    'mode main']
    ctrl-alt-shift-l = ['join-with right', 'mode main']

# ── Resize mode ───────────────────────────────────────────────────────────────
[mode.resize.binding]
    h     = 'resize width -50'
    j     = 'resize height +50'
    k     = 'resize height -50'
    l     = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    enter = 'mode main'
    esc   = 'mode main'
