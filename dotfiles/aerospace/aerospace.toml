config-version = 2

# Keybindings in the [mode.*] tables follow the Omachy guide
# (https://omachy.org/guide.html) — AeroSpace's stock defaults plus alt-f
# fullscreen, alt-shift-space float/tile, alt-q close, alt-r resize mode,
# alt-enter new terminal, the cmd-h disables and a resize mode; the workspace
# block is Mark's (five named, not numbered 1-9). Modifier is the physical
# Option (alt) key — no Karabiner remap. Everything above [mode.*] is local.

# ── Startup ──────────────────────────────────────────────────────────────────
# Border colours/width live in ~/.config/borders/bordersrc, not here — the
# borders daemon (brew services) applies them on start. Don't re-add a
# `borders active_color=...` line: it runs after login and overrides bordersrc.
after-startup-command = [
    'exec-and-forget sketchybar',
    # Launch the workspace apps on login (start-at-login = true). Each app's
    # windows are then routed to a workspace by the on-window-detected rules
    # further down. How many windows come back per app is the app's own
    # restore setting + macOS "reopen windows when logging back in" — for
    # Safari, turn on Settings > General > "Safari opens with: All windows
    # from last session".
    'exec-and-forget open -a Ghostty',
    'exec-and-forget open -a Safari',
    'exec-and-forget open -a Mail',
    'exec-and-forget open -a WhatsApp',
    'exec-and-forget open -a Vial',
]

start-at-login = true
automatically-unhide-macos-hidden-apps = true

# ── Layout defaults ───────────────────────────────────────────────────────────
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Five named workspaces, kept alive even when empty so the keys and the
# SketchyBar pills always land somewhere. Bound to alt-1..alt-5 below.
persistent-workspaces = ['desktop', 'terminal', 'browser', 'comms', 'coding']

# ── Tree normalizations ───────────────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ── Mouse follows focus ───────────────────────────────────────────────────────
on-focused-monitor-changed = []
on-focus-changed = []

# ── Sketchybar + Hammerspoon integration ─────────────────────────────────────
# Also drop the workspace name in ~/.cache/omachy/workspace — Hammerspoon
# pathwatches it to flash the name on screen (dotfiles/hammerspoon/wsflash.lua).
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; mkdir -p "$HOME/.cache/omachy"; printf %s "$AEROSPACE_FOCUSED_WORKSPACE" > "$HOME/.cache/omachy/workspace"'
]

# ── Key mapping ───────────────────────────────────────────────────────────────
[key-mapping]
    preset = 'qwerty'

# ── Gaps (Hyprland-style breathing room) ─────────────────────────────────────
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    # Per-monitor, because the sketchybar (bottom edge = y_offset 2 + height
    # 24 = 26pt) is only "free" on the built-in: its 28pt notch safe area
    # swallows the bar, so 8 there lands windows at safeArea(28) + 8 = 36pt,
    # clear. Every other display (the DELL dock) reserves nothing at the top
    # and the bar just floats over it, so the *gap* has to clear the 26pt bar
    # plus the ~3pt JankyBorders overhang — 34 puts window tops (and their
    # borders) ~5pt below the bar. Verified docked 2026-08-30.
    outer.top        = [{ monitor.'built-in' = 8 }, 34]
    outer.right      = 8

# ── Window rules ──────────────────────────────────────────────────────────────
# Apps that open floating rather than joining the tiles. Only fires on newly
# detected windows — reopen an already-open window for a new rule to take hold.
# Get an app-id with `aerospace list-apps`.
[[on-window-detected]]  # Activity Monitor
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'

[[on-window-detected]]  # App Store
    if.app-id = 'com.apple.AppStore'
    run = 'layout floating'

[[on-window-detected]]  # Archive Utility
    if.app-id = 'com.apple.archiveutility'
    run = 'layout floating'

[[on-window-detected]]  # Calculator
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]  # Calendar
    if.app-id = 'com.apple.iCal'
    run = 'layout floating'

[[on-window-detected]]  # CleanMyMac
    if.app-id = 'com.macpaw.CleanMyMac4'
    run = 'layout floating'

[[on-window-detected]]  # Finder
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]  # Home
    if.app-id = 'com.apple.Home'
    run = 'layout floating'

[[on-window-detected]]  # Messages
    if.app-id = 'com.apple.MobileSMS'
    run = 'layout floating'

[[on-window-detected]]  # Music
    if.app-id = 'com.apple.Music'
    run = 'layout floating'

[[on-window-detected]]  # Notes
    if.app-id = 'com.apple.Notes'
    run = 'layout floating'

[[on-window-detected]]  # Reminders
    if.app-id = 'com.apple.reminders'
    run = 'layout floating'

[[on-window-detected]]  # Screens Connect
    if.app-id = 'com.edovia.Screens-Connect'
    run = 'layout floating'

[[on-window-detected]]  # System Settings
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]  # Weather
    if.app-id = 'com.apple.weather'
    run = 'layout floating'

[[on-window-detected]]  # Windows App (Microsoft Remote Desktop)
    if.app-id = 'com.microsoft.rdc.macos'
    run = 'layout floating'

# ── Workspace routing ────────────────────────────────────────────────────────
# Pins each app to its workspace on login (paired with the `open -a` lines in
# after-startup-command) and whenever a new window appears. First match wins.
# Window *count* per app is the app's own restore + macOS window restoration,
# not this. Move a window between workspaces by hand with alt-shift-<n>.
# `coding` is left unrouted — put windows there yourself with alt-shift-5.

[[on-window-detected]]  # Safari — to `browser`
    if.app-id = 'com.apple.Safari'
    run = 'move-node-to-workspace browser'

[[on-window-detected]]  # Ghostty — the Hammerspoon scratchpad (Ctrl+`).
    # Float it and DON'T route it to a workspace, so the drop-down terminal
    # follows you (Hammerspoon owns its geometry + show/hide — scratchpad.lua).
    # Must precede the Ghostty rule below (first match wins).
    if.app-id = 'com.mitchellh.ghostty'
    if.window-title-regex-substring = '(?i)scratchpad'
    run = 'layout floating'

[[on-window-detected]]  # Ghostty — every window is the daily driver
    if.app-id = 'com.mitchellh.ghostty'
    run = 'move-node-to-workspace terminal'

[[on-window-detected]]  # Mail
    if.app-id = 'com.apple.mail'
    run = 'move-node-to-workspace comms'

[[on-window-detected]]  # WhatsApp
    if.app-id = 'net.whatsapp.WhatsApp'
    run = 'move-node-to-workspace comms'

[[on-window-detected]]  # Vial (keyboard config)
    if.app-id = 'today.vial'
    run = 'move-node-to-workspace desktop'

# ── Main keybindings (Omachy guide — https://omachy.org/guide.html) ──────────
# Follows the Omachy AeroSpace bindings, EXCEPT the workspaces below are named &
# positional (Mark's customisation) instead of Omachy's numbered 1-9.
[mode.main.binding]
    # Layout
    alt-slash       = 'layout tiles horizontal vertical'
    alt-comma       = 'layout accordion horizontal vertical'
    alt-shift-space = 'layout floating tiling'      # toggle floating / tiling
    alt-f           = 'macos-native-fullscreen'     # fullscreen the focused window

    # Focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'
    alt-r     = 'mode resize'          # enter resize mode (h/j/k/l to size)

    # Workspaces — five named, positional. See persistent-workspaces above and
    # the SketchyBar pills (dotfiles/sketchybar/sketchybarrc). 6-9 / A-Z dropped.
    alt-1 = 'workspace desktop'
    alt-2 = 'workspace terminal'
    alt-3 = 'workspace browser'
    alt-4 = 'workspace comms'
    alt-5 = 'workspace coding'

    # Move focused window to workspace (same positional keys + shift)
    alt-shift-1 = 'move-node-to-workspace desktop'
    alt-shift-2 = 'move-node-to-workspace terminal'
    alt-shift-3 = 'move-node-to-workspace browser'
    alt-shift-4 = 'move-node-to-workspace comms'
    alt-shift-5 = 'move-node-to-workspace coding'

    # Workspace navigation
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    # ctrl-arrows cycle the AeroSpace workspaces (macOS's own ctrl-left/right
    # "move a Space" is a no-op here — Mission Control is one Space per display).
    # Via the ws-cycle wrapper, NOT `workspace next|prev`: the built-in walks
    # workspaces alphabetically (browser, coding, comms, desktop, terminal),
    # ws-cycle walks them in the positional alt-1..alt-5 order instead.
    ctrl-left  = 'exec-and-forget $HOME/.config/aerospace/ws-cycle prev'
    ctrl-right = 'exec-and-forget $HOME/.config/aerospace/ws-cycle next'

    # Window
    alt-q     = 'close'
    alt-enter = 'exec-and-forget osascript -e "tell application \"Ghostty\" to new window"'

    # Stop the macOS hide shortcuts from making a tiled window vanish
    cmd-h     = []
    cmd-alt-h = []

    # Modes
    alt-shift-semicolon = 'mode service'

# ── Service mode (Omachy guide) ─────────────────────────────────────────────
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# ── Resize mode (Omachy guide) ─────────────────────────────────────────────
[mode.resize.binding]
    h     = 'resize width -50'
    j     = 'resize height +50'
    k     = 'resize height -50'
    l     = 'resize width +50'
    minus = 'resize smart -50'
    equal = 'resize smart +50'
    enter = 'mode main'
    esc   = 'mode main'
