config-version = 2

# Keybindings below are the stock AeroSpace defaults, verbatim from
# /Applications/AeroSpace.app/Contents/Resources/default-config.toml.
# Modifier is the physical Option (alt) key — no Karabiner remap involved.
# Everything above the [mode.*] tables is local customisation.

# ── Startup ──────────────────────────────────────────────────────────────────
# Border colours/width live in ~/.config/borders/bordersrc, not here — the
# borders daemon (brew services) applies them on start. Don't re-add a
# `borders active_color=...` line: it runs after login and overrides bordersrc.
after-startup-command = [
    'exec-and-forget sketchybar',
    # Launch the workspace apps on login (start-at-login = true). Each app's
    # windows are then routed to a workspace by the on-window-detected rules
    # further down. How many windows come back per app is the app's own
    # restore setting + macOS "reopen windows when logging back in" — for
    # Safari, turn on Settings > General > "Safari opens with: All windows
    # from last session".
    'exec-and-forget open -a Ghostty',
    'exec-and-forget open -a Safari',
    'exec-and-forget open -a Mail',
    'exec-and-forget open -a WhatsApp',
    'exec-and-forget open -a Vial',
    # AKS Lab workspace: an iTerm window on the AKS-Lab dynamic profile (which
    # cd's into the homelab repo and runs `./aks-lab tmux`) plus a dedicated
    # Safari window on the cluster dashboard. Both are routed to `aks-lab` by
    # the on-window-detected rules below. `activate` first — iTerm launched by
    # a detached osascript otherwise comes up hidden and AeroSpace won't see
    # its windows until it's unhidden. `make new document` forces a *new*
    # Safari window rather than a tab in the restored `browser` one. (iTerm may
    # also open a default-profile window on launch; it routes to aks-lab too.
    # Silence it with iTerm > Settings > General > Startup: "no windows".)
    '''exec-and-forget osascript -e 'tell application "iTerm" to activate' -e 'tell application "iTerm" to create window with profile "AKS-Lab"' ''',
    '''exec-and-forget osascript -e 'tell application "Safari" to make new document with properties {URL:"http://localhost:9997"}' ''',
]

start-at-login = true
automatically-unhide-macos-hidden-apps = true

# ── Layout defaults ───────────────────────────────────────────────────────────
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Six named workspaces, kept alive even when empty so the keys and the
# SketchyBar pills always land somewhere. Bound to alt-1..alt-6 below.
persistent-workspaces = ['desktop', 'terminal', 'browser', 'comms', 'man', 'aks-lab']

# ── Tree normalizations ───────────────────────────────────────────────────────
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# ── Mouse follows focus ───────────────────────────────────────────────────────
on-focused-monitor-changed = []
on-focus-changed = []

# ── Sketchybar integration ────────────────────────────────────────────────────
exec-on-workspace-change = ['/bin/bash', '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# ── Key mapping ───────────────────────────────────────────────────────────────
[key-mapping]
    preset = 'qwerty'

# ── Gaps (Hyprland-style breathing room) ─────────────────────────────────────
[gaps]
    inner.horizontal = 8
    inner.vertical   = 8
    outer.left       = 8
    outer.bottom     = 8
    # Per-monitor, because the sketchybar (bottom edge = y_offset 2 + height
    # 24 = 26pt) is only "free" on the built-in: its 28pt notch safe area
    # swallows the bar, so 8 there lands windows at safeArea(28) + 8 = 36pt,
    # clear. Every other display (the DELL dock) reserves nothing at the top
    # and the bar just floats over it, so the *gap* has to clear the 26pt bar
    # plus the ~3pt JankyBorders overhang — 34 puts window tops (and their
    # borders) ~5pt below the bar. Verified docked 2026-08-30.
    outer.top        = [{ monitor.'built-in' = 8 }, 34]
    outer.right      = 8

# ── Window rules ──────────────────────────────────────────────────────────────
# Apps that open floating rather than joining the tiles. Only fires on newly
# detected windows — reopen an already-open window for a new rule to take hold.
# Get an app-id with `aerospace list-apps`.
[[on-window-detected]]  # Activity Monitor
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'

[[on-window-detected]]  # App Store
    if.app-id = 'com.apple.AppStore'
    run = 'layout floating'

[[on-window-detected]]  # Archive Utility
    if.app-id = 'com.apple.archiveutility'
    run = 'layout floating'

[[on-window-detected]]  # Calculator
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]  # Calendar
    if.app-id = 'com.apple.iCal'
    run = 'layout floating'

[[on-window-detected]]  # CleanMyMac
    if.app-id = 'com.macpaw.CleanMyMac4'
    run = 'layout floating'

[[on-window-detected]]  # Finder
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]  # Messages
    if.app-id = 'com.apple.MobileSMS'
    run = 'layout floating'

[[on-window-detected]]  # Music
    if.app-id = 'com.apple.Music'
    run = 'layout floating'

[[on-window-detected]]  # Notes
    if.app-id = 'com.apple.Notes'
    run = 'layout floating'

[[on-window-detected]]  # Reminders
    if.app-id = 'com.apple.reminders'
    run = 'layout floating'

[[on-window-detected]]  # Screens Connect
    if.app-id = 'com.edovia.Screens-Connect'
    run = 'layout floating'

[[on-window-detected]]  # System Settings
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]  # Weather
    if.app-id = 'com.apple.weather'
    run = 'layout floating'

[[on-window-detected]]  # Windows App (Microsoft Remote Desktop)
    if.app-id = 'com.microsoft.rdc.macos'
    run = 'layout floating'

# ── Workspace routing ────────────────────────────────────────────────────────
# Pins each app to its workspace on login (paired with the `open -a` lines in
# after-startup-command) and whenever a new window appears. First match wins,
# so the Safari title rule must come before the catch-all Safari rule.
# Window *count* per app is the app's own restore + macOS window restoration,
# not this. Move a window between workspaces by hand with alt-shift-<n>.

[[on-window-detected]]  # Safari — the AKS Lab dashboard to `aks-lab`
    # Must precede the two rules below (first match wins). Best-effort: it
    # matches the window title *at creation*, which for a freshly-opened
    # `make new document` window is the loading URL ("localhost:9997") before
    # the page renders its own <title>. If the dashboard's title turns out to
    # be something stable, tighten this to that; if a window slips through to
    # `browser`, alt-shift-6 moves it.
    if.app-id = 'com.apple.Safari'
    if.window-title-regex-substring = '(?i)localhost:9997'
    run = 'move-node-to-workspace aks-lab'

[[on-window-detected]]  # Safari — docs/manuals to `man`
    if.app-id = 'com.apple.Safari'
    if.window-title-regex-substring = '(?i)guide|docs|documentation|manual|reference|readme|handbook'
    run = 'move-node-to-workspace man'

[[on-window-detected]]  # Safari — everything else to `browser`
    if.app-id = 'com.apple.Safari'
    run = 'move-node-to-workspace browser'

[[on-window-detected]]  # Ghostty
    if.app-id = 'com.mitchellh.ghostty'
    run = 'move-node-to-workspace terminal'

[[on-window-detected]]  # iTerm — the lab terminal (Ghostty is the daily driver,
    # so every iTerm window — AKS-Lab, IDE, k8s-exam, … — lands on `aks-lab`).
    # To send one profile elsewhere, add a title/app rule *above* this one.
    if.app-id = 'com.googlecode.iterm2'
    run = 'move-node-to-workspace aks-lab'

[[on-window-detected]]  # Mail
    if.app-id = 'com.apple.mail'
    run = 'move-node-to-workspace comms'

[[on-window-detected]]  # WhatsApp
    if.app-id = 'net.whatsapp.WhatsApp'
    run = 'move-node-to-workspace comms'

[[on-window-detected]]  # Vial (keyboard config)
    if.app-id = 'today.vial'
    run = 'move-node-to-workspace man'

# ── Main keybindings (AeroSpace defaults) ────────────────────────────────────
[mode.main.binding]
    # Layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    # Focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Workspaces — six named, positional. See persistent-workspaces above and
    # the SketchyBar pills (dotfiles/sketchybar/sketchybarrc). 7-9 / A-Z dropped.
    alt-1 = 'workspace desktop'
    alt-2 = 'workspace terminal'
    alt-3 = 'workspace browser'
    alt-4 = 'workspace comms'
    alt-5 = 'workspace man'
    alt-6 = 'workspace aks-lab'

    # Move focused window to workspace (same positional keys + shift)
    alt-shift-1 = 'move-node-to-workspace desktop'
    alt-shift-2 = 'move-node-to-workspace terminal'
    alt-shift-3 = 'move-node-to-workspace browser'
    alt-shift-4 = 'move-node-to-workspace comms'
    alt-shift-5 = 'move-node-to-workspace man'
    alt-shift-6 = 'move-node-to-workspace aks-lab'

    # Workspace navigation
    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # Service mode
    alt-shift-semicolon = 'mode service'

# ── Service mode (AeroSpace defaults) ────────────────────────────────────────
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
