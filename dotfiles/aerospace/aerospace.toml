# AeroSpace config — Omarchy-style keyboard-driven tiling.
# Symlinked to ~/.config/aerospace/aerospace.toml by bootstrap.sh.
#
# Modifier: Karabiner-Elements remaps Caps Lock (held) -> Ctrl+Option, used
# below as ctrl-alt. See ~/.dotfiles/snapshots/karabiner/karabiner.json.
# Caps Lock tapped alone sends Escape instead (vim-friendly, unrelated to
# AeroSpace).
#
# Workspace names mirror the old DesktopRenamer macOS Spaces (term/web/lab/
# notes/comms) — AeroSpace workspaces now own that job. "Displays have
# separate Spaces" should be OFF in System Settings > Desktop & Dock (manual,
# GUI-only) for correct cross-monitor behavior; Mission Control collapses
# back to one Space per display and DesktopRenamer/hotkeys 118-127 go dormant.

config-version = 2

start-at-login = true
automatically-unhide-macos-hidden-apps = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Notify SketchyBar of workspace changes. Guarded with `command -v` so this
# is a silent no-op until SketchyBar is installed in a later phase. Must be
# a top-level key — AeroSpace rejects it if it ends up nested under a table
# header like [exec] or [gaps] (TOML applies key=value to whatever table
# header precedes it, so this has to come before any of those).
exec-on-workspace-change = ['/bin/bash', '-c',
    'command -v sketchybar >/dev/null && sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Bar-clearance not yet tuned against SketchyBar (installed in a later
# phase) — these are a starting point, not a measured value. Revisit once
# SketchyBar is running, on both the built-in display and docked to the DELL.
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.right = 8
outer.bottom = 8
outer.top = 8

[exec]
inherit-env-vars = true


[mode.main.binding]
# Focus
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

# Move window
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

# Layout
ctrl-alt-slash = 'layout tiles horizontal vertical'
ctrl-alt-comma = 'layout accordion horizontal vertical'
ctrl-alt-f = 'fullscreen'
ctrl-alt-shift-space = 'layout floating tiling'

# Resize mode (no mouse-drag resize in AeroSpace by design — this is the
# standard workaround: enter a mode, resize with hjkl, esc/enter to leave)
ctrl-alt-r = 'mode resize'

# Workspaces — term/web/lab/notes/comms, matching the old 5-desktop naming
ctrl-alt-1 = 'workspace term'
ctrl-alt-2 = 'workspace web'
ctrl-alt-3 = 'workspace lab'
ctrl-alt-4 = 'workspace notes'
ctrl-alt-5 = 'workspace comms'
ctrl-alt-shift-1 = 'move-node-to-workspace term'
ctrl-alt-shift-2 = 'move-node-to-workspace web'
ctrl-alt-shift-3 = 'move-node-to-workspace lab'
ctrl-alt-shift-4 = 'move-node-to-workspace notes'
ctrl-alt-shift-5 = 'move-node-to-workspace comms'

ctrl-alt-enter = 'exec-and-forget open -na iTerm'
ctrl-alt-shift-r = 'reload-config'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height +50'
k = 'resize height -50'
enter = 'mode main'
esc = 'mode main'

# App routing. Bundle IDs for iTerm2/Safari/Notes/Messages/Mail/Finder are
# well-known; the rest use a name substring instead of guessing an ID wrong.
# If a rule doesn't fire, run `aerospace list-apps` to get the exact app-id
# and swap it in — don't assume these are all correct un-tested.
[[on-window-detected]]
if.app-id = 'com.googlecode.iterm2'
run = 'move-node-to-workspace term'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace web'

[[on-window-detected]]
if.app-name-regex-substring = 'Brave'
run = 'move-node-to-workspace web'

[[on-window-detected]]
if.app-name-regex-substring = 'Freelens'
run = 'move-node-to-workspace lab'

[[on-window-detected]]
if.app-name-regex-substring = 'Headlamp'
run = 'move-node-to-workspace lab'

[[on-window-detected]]
if.app-name-regex-substring = 'Postman'
run = 'move-node-to-workspace lab'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'move-node-to-workspace notes'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = 'move-node-to-workspace comms'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'move-node-to-workspace comms'

# Confirmed installed via `aerospace list-apps` — the comms app actually in
# use, not just Messages/Mail.
[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace comms'

# Doesn't tile well — float it instead of forcing it into the grid.
[[on-window-detected]]
if.app-name-regex-substring = 'System Settings'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
if.window-title-regex-substring = '^(?!Desktop$).*'
run = 'layout floating'
